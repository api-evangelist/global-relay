naftiko: 1.0.0-alpha2
info:
  label: Global Relay Event Archiving API — Files
  description: 'Global Relay Event Archiving API — Files. 1 operations. Lead operation: Global Relay Upload a file attachment
    for an event. Self-contained Naftiko capability covering one Global Relay business surface.'
  tags:
  - Global Relay
  - Files
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GLOBAL_RELAY_API_KEY: GLOBAL_RELAY_API_KEY
capability:
  consumes:
  - type: http
    namespace: event-archiving-files
    baseUri: https://events.api.globalrelay.com/v2
    description: Global Relay Event Archiving API — Files business capability. Self-contained, no shared references.
    resources:
    - name: files
      path: /files
      operations:
      - name: uploadeventfile
        method: POST
        description: Global Relay Upload a file attachment for an event
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.GLOBAL_RELAY_API_KEY}}'
  exposes:
  - type: rest
    namespace: event-archiving-files-rest
    port: 8080
    description: REST adapter for Global Relay Event Archiving API — Files. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/files
      name: files
      description: REST surface for files.
      operations:
      - method: POST
        name: uploadeventfile
        description: Global Relay Upload a file attachment for an event
        call: event-archiving-files.uploadeventfile
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: event-archiving-files-mcp
    port: 9090
    transport: http
    description: MCP adapter for Global Relay Event Archiving API — Files. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: global-relay-upload-file-attachment
      description: Global Relay Upload a file attachment for an event
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: event-archiving-files.uploadeventfile
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
