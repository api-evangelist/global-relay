naftiko: 1.0.0-alpha2
info:
  label: Global Relay Voice Archiving API — Voice
  description: 'Global Relay Voice Archiving API — Voice. 1 operations. Lead operation: Global Relay Archive a voice or video
    recording. Self-contained Naftiko capability covering one Global Relay business surface.'
  tags:
  - Global Relay
  - Voice
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GLOBAL_RELAY_API_KEY: GLOBAL_RELAY_API_KEY
capability:
  consumes:
  - type: http
    namespace: voice-archiving-voice
    baseUri: https://voice.api.globalrelay.com/v2
    description: Global Relay Voice Archiving API — Voice business capability. Self-contained, no shared references.
    resources:
    - name: voice
      path: /voice
      operations:
      - name: archivevoicerecord
        method: POST
        description: Global Relay Archive a voice or video recording
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.GLOBAL_RELAY_API_KEY}}'
  exposes:
  - type: rest
    namespace: voice-archiving-voice-rest
    port: 8080
    description: REST adapter for Global Relay Voice Archiving API — Voice. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/voice
      name: voice
      description: REST surface for voice.
      operations:
      - method: POST
        name: archivevoicerecord
        description: Global Relay Archive a voice or video recording
        call: voice-archiving-voice.archivevoicerecord
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: voice-archiving-voice-mcp
    port: 9090
    transport: http
    description: MCP adapter for Global Relay Voice Archiving API — Voice. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: global-relay-archive-voice-video
      description: Global Relay Archive a voice or video recording
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: voice-archiving-voice.archivevoicerecord
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
